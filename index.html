<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>snowglobe</title>
        <link rel="stylesheet" href="style.css" />
    
    </head>
    <body>
       <header class="hero">
        <h1>snowglobe</h1>
        <p>shake it for a some winter cheer!❄️☃️</p>
       </header>
       <main>
        <section class="globe-card">
            <div class="globe" id="globe">
                <img class="" src="snowglobe.png" alt="snowglobe">
            </div>
            <button id="shake">shake the globe!</button>
            <p class="message" id="message"> press the button to shake the globe!</p>
                
        </section>
       </main>
       <footer>
        <p>yay! play in the snow today!</p>
       </footer>
       
    </body>
</html>
